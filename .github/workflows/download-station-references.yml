name: Download station melody references

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_reference_videos.py"
      - ".github/workflows/download-station-references.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Download reference candidates
        run: python scripts/download_reference_videos.py

      - name: Upload private analysis references
        uses: actions/upload-artifact@v4
        with:
          name: station-melody-reference-candidates
          path: reference-out
          if-no-files-found: error
          retention-days: 1
