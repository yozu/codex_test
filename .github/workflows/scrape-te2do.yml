name: Scrape te2do station previews
on:
  push:
    branches: [main]
    paths:
      - scripts/scrape_te2do.py
      - .github/workflows/scrape-te2do.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scrape
        run: python scripts/scrape_te2do.py
      - uses: actions/upload-artifact@v4
        with:
          name: te2do-scrape
          path: te2do-out
          if-no-files-found: error
          retention-days: 1
