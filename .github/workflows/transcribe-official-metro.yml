name: Transcribe official Metro station melodies

on:
  push:
    branches: [main]
    paths:
      - "scripts/transcribe_official_metro.py"
      - ".github/workflows/transcribe-official-metro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg and Basic Pitch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "basic-pitch==0.4.0"

      - name: Transcribe official previews
        run: python scripts/transcribe_official_metro.py

      - name: Upload transcription
        uses: actions/upload-artifact@v4
        with:
          name: official-metro-basic-pitch
          path: metro-out
          if-no-files-found: error
          retention-days: 1
