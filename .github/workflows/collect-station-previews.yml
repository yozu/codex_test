name: Collect station melody previews

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_previews.py"
      - ".github/workflows/collect-station-previews.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect official preview candidates
        run: python scripts/collect_previews.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: station-melody-preview-candidates
          path: out
          if-no-files-found: error
          retention-days: 1
