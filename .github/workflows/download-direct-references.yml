name: Download direct station references

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_direct_references.py"
      - ".github/workflows/download-direct-references.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download direct references
        run: python scripts/download_direct_references.py
      - name: Upload references
        uses: actions/upload-artifact@v4
        with:
          name: direct-station-reference-audio
          path: direct-out
          if-no-files-found: error
          retention-days: 1
